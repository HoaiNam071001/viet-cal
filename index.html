<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nhật Ký Lịch — Lịch Âm Dương Việt Nam & Nhật Ký</title>
    <meta
      name="description"
      content="Lịch Dương và Lịch Âm Việt Nam: xem ngày tốt, can chi, tiết khí, ngày lễ, chuyển đổi ngày âm dương và ghi nhật ký cá nhân."
    />
    <meta name="theme-color" content="#f4fbf6" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nhật Ký Lịch" />
    <script>
      // Apply the stored theme before first paint so the app never flashes white.
      ;(function () {
        try {
          var stored = JSON.parse(localStorage.getItem('vietcal:theme') || '"system"')
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b1d20')
          }
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
